<!DOCTYPE html>
<!-- YGOUltraLab © Gastón Valles. Todos los derechos reservados. -->
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- Lo primero del head, sin hash: Vite pone el módulo de la app en el head, y el script tiene que estar escuchando antes de que ese módulo pueda fallar. Si un archivo de /assets falla al cargar justo después de un deploy, lo vuelve a bajar y recarga (el porqué está en el propio archivo). -->
    <script src="/recover.js"></script>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <!-- La URL pública está también en robots.txt y sitemap.xml (public/): si cambia el dominio, se cambia en los tres. -->
    <link rel="canonical" href="https://yu-gi-oh-probability-lab.vercel.app/" />
    <link rel="preconnect" href="https://db.ygoprodeck.com" crossorigin />
    <!-- Los tres pesos de Lexend Deca se ven en el primer pantallazo; Vite reescribe estas rutas al archivo con hash. El crossorigin es obligatorio: sin él el navegador baja cada fuente dos veces. -->
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/src/fonts/lexend-deca-latin-400-normal.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/src/fonts/lexend-deca-latin-600-normal.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/src/fonts/lexend-deca-latin-700-normal.woff2" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Deck builder y calculadora exacta de probabilidades para Yu-Gi-Oh!: armá tu deck, clasificá cartas y medí su consistencia." />
    <meta name="author" content="Gastón Valles" />
    <meta name="copyright" content="© Gastón Valles. Todos los derechos reservados. Sitio no oficial: Yu-Gi-Oh! es una marca de Konami." />
    <meta name="theme-color" content="#150a24" />
    <!-- Vista previa al compartir el link (Discord, WhatsApp, X, Telegram): estos bots no ejecutan JS, así que va en el HTML estático. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="YGOUltraLab" />
    <meta property="og:locale" content="es_AR" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta property="og:title" content="YGOUltraLab" />
    <meta property="og:description" content="Deck builder y calculadora exacta de probabilidades para Yu-Gi-Oh!: armá tu deck, clasificá cartas y medí su consistencia." />
    <meta property="og:url" content="https://yu-gi-oh-probability-lab.vercel.app/" />
    <meta property="og:image" content="https://yu-gi-oh-probability-lab.vercel.app/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="YGOUltraLab: deck builder y calculadora exacta de probabilidades para Yu-Gi-Oh!" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>YGOUltraLab</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
