name: Sync meta decks

# Los Tournament Meta Decks de YGOPRODeck, los precios de TCGplayer (vía TCGCSV) y las banlists (lflist.conf de YGOPro) cambian
# todos los días: se bajan a la mañana (UTC) y, si hay novedades, el commit a main dispara el deploy en Vercel.
on:
  schedule:
    - cron: '20 6 * * *'
  workflow_dispatch:

# A diferencia de CI, este job escribe en el repo (sólo el archivo de datos).
permissions:
  contents: write

concurrency: sync-meta-decks

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      # Acciones fijadas por commit (no por tag movible): lo que corre es exactamente lo que se revisó.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Los pasos que bajan datos corren código de dependencias: sin credencial guardada en `.git`. El push usa el token por separado, en su propio paso.
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # Sin scripts de instalación: ninguna dependencia necesita correr código al instalarse (ver `.npmrc`).
      - run: npm ci --ignore-scripts
      - run: npm run sync:meta

      # Si TCGCSV falla, los datos del meta se publican igual y los precios quedan como estaban.
      - run: npm run sync:prices
        continue-on-error: true

      # Si lflist.conf o YGOPRODeck fallan, las banlists quedan como estaban.
      - run: npm run sync:banlists
        continue-on-error: true

      - name: Commit si cambió
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # `git add` primero: los precios pueden traer archivos nuevos (o borrar los viejos) que `git diff` no vería.
          git add src/data/meta-decks.json src/data/meta-decklists.json src/data/card-rules.json src/data/banlists.json public/prices
          if git diff --cached --quiet; then
            echo "Sin cambios."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Datos diarios: meta de YGOPRODeck, precios de TCGplayer y banlists al $(date -u +%Y-%m-%d)"
          # El checkout no dejó la credencial guardada: el token se usa recién acá, sólo para este push.
          auth=$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:main
