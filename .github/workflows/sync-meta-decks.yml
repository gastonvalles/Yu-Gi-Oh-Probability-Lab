name: Sync meta decks

# Los Tournament Meta Decks de YGOPRODeck cambian casi todos los días: se bajan a la mañana (UTC) y,
# si hay novedades, el commit a main dispara el deploy en Vercel.
on:
  schedule:
    - cron: '20 6 * * *'
  workflow_dispatch:

# A diferencia de CI, este job escribe en el repo (sólo el archivo de datos).
permissions:
  contents: write

concurrency: sync-meta-decks

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      # Acciones fijadas por commit (no por tag movible): lo que corre es exactamente lo que se revisó.
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run sync:meta

      - name: Commit si cambió
        run: |
          if git diff --quiet -- src/data/meta-decks.json src/data/meta-decklists.json; then
            echo "Sin cambios."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/meta-decks.json src/data/meta-decklists.json
          git commit -m "Meta: Tournament Meta Decks de YGOPRODeck al $(date -u +%Y-%m-%d)"
          git push
