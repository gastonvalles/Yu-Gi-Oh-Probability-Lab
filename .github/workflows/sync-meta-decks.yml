name: Sync meta decks

# Los Tournament Meta Decks de YGOPRODeck cambian casi todos los días: se bajan a la mañana (UTC) y,
# si hay novedades, el commit a main dispara el deploy en Vercel.
on:
  schedule:
    - cron: '20 6 * * *'
  workflow_dispatch:

# A diferencia de CI, este job escribe en el repo (sólo el archivo de datos).
permissions:
  contents: write

concurrency: sync-meta-decks

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      # Acciones fijadas por commit (no por tag movible): lo que corre es exactamente lo que se revisó.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run sync:meta

      - name: Commit si cambió
        run: |
          if git diff --quiet -- src/data/meta-decks.json src/data/meta-decklists.json src/data/card-rules.json; then
            echo "Sin cambios."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/meta-decks.json src/data/meta-decklists.json src/data/card-rules.json
          git commit -m "Meta: Tournament Meta Decks de YGOPRODeck al $(date -u +%Y-%m-%d)"
          git push
