name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# El token del job sólo lee el repo: ningún paso necesita escribir.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Acciones fijadas por commit (no por tag movible): lo que corre es exactamente lo que se revisó.
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
